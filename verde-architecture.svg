<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">VERDE hardware architecture</title><desc id="desc">Water quality sensors pass through an ADC to a Raspberry Pi 5. Temperature, humidity and camera inputs connect directly. Relay module 3 switches the EC sensor supply. Relay modules 1 and 2 control circulation and dosing pumps. The Pi communicates with GSM alerts, the dashboard and detection log.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92cfa5"/></marker></defs>
